<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A quiet, guided timer for clinician-directed VOR X1 and VOR X2 gaze stabilization exercises, with adjustable sessions and linked research.">
  <title>Vestibular</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/instrument-serif.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" tabindex="-1">
    <section id="home-view" class="home-view" aria-labelledby="home-title">
      <div class="hero-copy">
        <h1 id="home-title"><a class="wordmark" href="./" aria-label="Vestibular home"><span class="brand-symbol" aria-hidden="true"><i></i></span>vestibular<span class="wordmark-period">.</span></a></h1>
        <p>Choose an exercise.</p>
      </div>
      <div class="mode-list" aria-label="Exercises">
        <button class="mode-option" data-mode="x1"><span class="mode-title">VOR X1</span><span class="mode-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button>
        <button class="mode-option" data-mode="x2"><span class="mode-title">VOR X2</span><span class="mode-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button>
        <button class="mode-option" data-mode="combined"><span class="mode-title">Combined session</span><span class="mode-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button>
      </div>
    </section>
    <section id="setup-view" class="setup-view" hidden aria-labelledby="setup-title"></section>
    <section id="session-view" class="session-view" hidden aria-labelledby="session-title"></section>
  </main>
  <footer class="site-footer"><button class="info-button" data-action="info"><span class="info-symbol" aria-hidden="true">i</span> Research &amp; safety</button><p>For education and clinician-directed practice. Not medical advice.</p></footer>
  <dialog id="info-dialog" aria-labelledby="info-title">
    <div class="dialog-top"><span class="eyebrow">THE THINKING BEHIND THE PRACTICE</span><button class="icon-button" data-action="close-info" aria-label="Close research and safety">×</button></div>
    <h2 id="info-title">Research &amp; safety</h2>
    <p class="dialog-intro">A guided exercise timer to support a plan made with a vestibular clinician.</p>
    <div id="research-content"></div>
    <button class="primary-button dialog-done" data-action="close-info">Back to practice</button>
  </dialog>
  <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">Please enable JavaScript to use the guided exercise timer.</p></noscript>
</body>
</html>
